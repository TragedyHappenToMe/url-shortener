services:
    app:
        build: .
        ports:
            - "8000:8000"
        environment:
            - DB_HOST=db
            - DB_NAME=shortener
            - DB_USER=user
            - DB_PASSWORD=password
        depends_on:
            db:
                condition: service_healthy
            
    db:
        image: postgres:16-alpine
        environment:
            - POSTGRES_DB=shortener
            - POSTGRES_USER=user
            - POSTGRES_PASSWORD=password
        volumes:
            - db_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U user -d shortener"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    db_data: